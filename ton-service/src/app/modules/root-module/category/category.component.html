<app-router></app-router>
<app-subcategory-navigator></app-subcategory-navigator>

<div class="container-fluid container-mw pb-2">
  <div class="card-columns">
    <div *ngFor="let example of this.examples; let i = index"
         class="pb-2"
         data-toggle="modal"
         data-target="#categoryModal"
         (click)="openExampleModal(i)">
      <img [src]="example.formattedImage"
           class="card-img"
           alt="Пример"
           loading="lazy"
           decoding="async">
    </div>
  </div>
</div>

<div class="modal fade" id="categoryModal" tabindex="-1" role="dialog" aria-hidden="true">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-body">

        <div id="categoryCarousel" class="carousel slide" data-interval="false">
          <div class="carousel-inner">
            <div *ngFor="let example of this.examples; let i = index"
                 class="carousel-item">
              <img [src]="example.formattedImage"
                   class="d-block w-100 active-image"
                   alt="Пример"
                   loading="lazy"
                   decoding="async">
            </div>
          </div>

          <a class="carousel-control-prev" href="#categoryCarousel" role="button" data-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="sr-only">Previous</span>
          </a>
          <a class="carousel-control-next" href="#categoryCarousel" role="button" data-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="sr-only">Next</span>
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
