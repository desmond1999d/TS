<div class="main-page-carousel-container">
  <div class="row">
    <h1 class="carousel-header">Наши услуги</h1>
  </div>
  <div id="carouselExampleCaptions" class="carousel slide" data-ride="carousel">
    <div class="carousel-inner align-content-center">
      <div class="slides-container">
        <div *ngFor="let slide of slides; let i = index"
             class="carousel-item"
             [class.active]="i === 0">
          <div class="carousel-item-content">
            <img [src]="slide.fullSrc"
                 class="full-width d-block w-100"
                 [alt]="slide.header"
                 [attr.loading]="i === 0 ? 'eager' : 'lazy'"
                 [attr.fetchpriority]="i === 0 ? 'high' : null"
                 decoding="async">
            <img [src]="slide.cropSrc"
                 class="crop d-block w-100"
                 [alt]="slide.header"
                 loading="lazy"
                 decoding="async">
            <div class="carousel-caption">
              <div class="carousel-item-header">{{ slide.header }}</div>
              <div class="carousel-text" [innerHTML]="slide.textHtml"></div>
            </div>
          </div>
        </div>
      </div>
      <ol class="carousel-indicators">
        <li *ngFor="let slide of slides; let i = index"
            data-target="#carouselExampleCaptions"
            [attr.data-slide-to]="i"
            [class.active]="i === 0"></li>
      </ol>
    </div>
  </div>
</div>
